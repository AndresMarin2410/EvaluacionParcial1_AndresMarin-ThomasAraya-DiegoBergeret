<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>contacto veterinaria</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/funciones.js" defer></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-espacio-vacio"></div>
            <ul class="nav-centro">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="blogs.html">Blogs</a></li>
            </ul>

            <ul class="nav-derecha">
                <li><a href="registro-usuario.html">Registrar</a></li>
                <li><a href="iniciar-sesion.html">Inicio sesion</a></li>
            </ul>
        </nav>
        <div class="logo-titulo">
            <img src="img/01fd6fe38564f122b6e092a7c74ab1ce.png" class="logo-veterinaria" alt="logo-veterinaria">
            <h1>Clínica veterinaria San Marcos</h1>
            <h2>Saludo, amor y bienestar para tus mejores amigos</h2>
        </div>
    </header>
     
        
    <main>
        <section class="formularios">
            <form id="formulario-contacto" class="formulario-registro" novalidate>
                <h2>Formulario de contactos</h2>

                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" placeholder="Nombre completo" required>

                <label for="correo">Correo electronico:</label>
                <input type="email" id="correocon" placeholder="correo@ejemplo.cl" required>

                <label for="textarea">Mensaje</label>
                <textarea rows="3" id="textarea"></textarea>

                <button type="submit" class="btn-registrar">Enviar mensaje</button>
                <p id="mensaje-contacto"></p>
            </form>
        </section>
    </main>

    
</body>
</html>
