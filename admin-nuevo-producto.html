<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/funciones.js" defer></script>
    <title>Nuevo producto - Panel administrador</title>
</head>

<body class="admin-body">

    <header class="admin-header">
        <div class="logo-titulo">
            <img src="img/01fd6fe38564f122b6e092a7c74ab1ce.png" class="logo-veterinaria" alt="logo-veterinaria">
            <h1>Panel administrador</h1>
        </div>
    </header>

    <div class="admin-layout">

        <nav class="admin-menu">
            <ul>
                <li><a href="admin-home.html">Inicio</a></li>
                <li><a href="admin-producto.html" class="activo">Producto</a></li>
                <li><a href="admin-usuario.html">Usuario</a></li>
                <li><a href="index.html">Volver a la tienda</a></li>
            </ul>
        </nav>

        <main class="admin-contenido">
            <h2>Nuevo producto</h2>

            <form id="formulario-nuevo-producto" class="formulario-registro" novalidate>

                <label for="codigo-producto">Código producto:</label>
                <input type="text" id="codigo-producto" placeholder="Ej: PROD-001" required minlength="3">

                <label for="nombre-producto">Nombre:</label>
                <input type="text" id="nombre-producto" placeholder="Nombre del producto" required maxlength="100">

                <label for="descripcion-producto">Descripción:</label>
                <textarea id="descripcion-producto" placeholder="Descripción (opcional)" maxlength="500"></textarea>

                <label for="precio-producto">Precio:</label>
                <input type="number" id="precio-producto" placeholder="0" required min="0" step="0.01">

                <label for="stock-producto">Stock:</label>
                <input type="number" id="stock-producto" placeholder="0" required min="0" step="1">

                <label for="stock-critico-producto">Stock crítico (opcional):</label>
                <input type="number" id="stock-critico-producto" placeholder="0" min="0" step="1">

                <label for="categoria-producto">Categoría:</label>
                <select id="categoria-producto" required>
                    <option value="">Selecciona una categoría</option>
                    <option>Consultas</option>
                    <option>Vacunación</option>
                    <option>Cirugía</option>
                    <option>Desparasitación</option>
                    <option>Exámenes</option>
                    <option>Otros</option>
                </select>

                <label for="imagen-producto">Imagen (opcional):</label>
                <input type="file" id="imagen-producto" accept="image/*">

                <button type="submit" class="btn-registrar">Guardar producto</button>
                <p id="mensaje-confirmacion-producto"></p>
            </form>
        </main>

    </div>

    

</body>

</html>
