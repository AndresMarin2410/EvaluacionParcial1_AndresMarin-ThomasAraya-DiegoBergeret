<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Registro de usuario</title>
</head>
<body>

    <header>

        <div class="logo-titulo">
            <h1>Registro</h1>
        </div>

        <nav class="volver-inicio">
            <ul>
                <li><a href="index.html">Volver al inicio</a></li>
                <li><a href="IniciarSesion.html">Iniciar Sesion</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="formularios">
            <form id="formulario-mascota" class="formulario-registro" novalidate>
                <h2>Datos Mascota</h2>
                <label for="nombre-mascota">Nombre Mascota:</label>
                <input type="text" id="nombre-mascota" placeholder="Nombre Mascota" required>

                <label for="especie">Especie:</label>
                <input type="text"id="especie" placeholder="Especie" required>

                <label for="raza">Raza:</label>
                <input type="text" id="raza" placeholder="Raza">

                <label for="sexo">Sexo:</label>
                <input type="text" id="sexo" placeholder="Sexo" required>

                <label for="fecha-nacimiento">Fecha de nacimiento: </label>
                <input type="date" id="fecha-nacimiento">
                <label for="comentario">Comentario (Opcional):</label>
                <textarea id="comentario"></textarea>
                <fieldset>
                <p>¿La mascota está esterilizada?</p>
                    <label>
                    <input type="radio" name="esterilizada" value="si">
                    Sí
                    </label>

                    <label>
                    <input type="radio" name="esterilizada" value="no" checked>
                    No
                    </label>
                </fieldset>
            </form>
            <form id="formulario-dueño" class="formulario-registro" novalidate>
                <h2>Datos Dueño</h2>
                <label for="nombre-completo">Nombre Completo:</label>
                <input type="text" id="nombre-completo" placeholder="Nombre completo" required>

                <label for="rut">RUN:</label>
                <input type="text" id="rut" placeholder="xx.xxx.xxx-x">

                <label for="telefono">Telefono:</label>
                <input type="text" id="telefono" placeholder="+569xxxxxxxx" required>

                <label for="correo">Correo electronico:</label>
                <input type="email" id="correo" placeholder="correo@ejemplo.cl" required>

                <label for="direccion">Direccion:</label>
                <input type="text" id="direccion" placeholder="Direccion" required>
                
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" placeholder="xxxxxxxxxx">
                <button type="submit" class="btn-registrar">Registrar</button>
            </form>
        </section>
    </main>

    <footer class="footer-sitio">
        <div class="contenedor-footer">
            <div class="columna-footer">
                <h3>Contacto</h3>
                <p><span class="icono">📞</span>+569-55668923</p>
                <p><span class="icono">✉️</span>vetSanmarcos@gmail.com</p>
                <p><span class="icono">📍</span>Rancagua, Región del Libertador General Bernardo O'Higgins</p>
            </div>

            <div class="columna-footer">

                <h3>Horario de atención</h3>
                <p><span class="icono">📅</span>Los 365 días del año</p>
                <p><span class="icono">⏳</span> Urgencias las 24 hrs. del dia</p>
                
            </div>

            <div>
                <img src="img/perro y gato.png" class="logo-footer">
            </div>
        </div>

        
    </footer>
    
</body>
</html>
